[package]
categories = ["api-bindings", "wasm"]
description = "A safe and ergonomic Rust binding for the zwasm WebAssembly runtime, supporting Wasm 3.0, WASI, and host function imports."
documentation = "https://docs.rs/zwasm-sdk"
edition = "2021"
license = "MIT"
name = "zwasm-sdk"
readme = "README.md"
repository = "https://github.com/zwasm/zwasm-rust-sdk"
version = "0.3.0"

[dependencies]
zwasm-sys = { path = "crates/zwasm-sys", version = "0.3.0" }
thiserror = "2.0.18"

[workspace]
members = ["crates/zwasm-sys"]
