# No Cargo.lock is committed, so every build here resolves afresh. This keeps
# the resolver off a version published in the last 7 days, which gives a
# compromised release time to be noticed and yanked. Needs cargo 1.100.0;
# older ones ignore the key.
#
# `cargo publish -p zwasm-sdk` right after zwasm-sys is the one place this
# gets in the way, because the sibling it resolves is minutes old. Run that
# one command with CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow.
[registry]
global-min-publish-age = "7 days"
